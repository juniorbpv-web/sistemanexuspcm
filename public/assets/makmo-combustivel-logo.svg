<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      .bg { fill: #07213d; }
      .teal-stroke { stroke: #20bca9; stroke-width: 10; fill: none; }
      .white-stroke { stroke: #ffffff; stroke-width: 6; fill: none; stroke-linecap: round; }
      .teal-fill { fill: #20bca9; }
      .white-fill { fill: #ffffff; }
      .brand-name {
        font-family: 'Arial Black', 'Montserrat', 'Impact', sans-serif;
        font-weight: 900;
        font-size: 64px;
        fill: #ffffff;
        text-anchor: middle;
        letter-spacing: 3px;
      }
      .brand-sub {
        font-family: 'Arial', 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 22px;
        fill: #20bca9;
        text-anchor: middle;
        letter-spacing: 7px;
      }
    </style>
  </defs>

  <!-- Deep Blue Circular Background -->
  <circle cx="250" cy="250" r="246" class="bg" />

  <!-- Outer Teal Ring -->
  <circle cx="250" cy="250" r="216" class="teal-stroke" />

  <!-- Inner White Circle / Arcs -->
  <!-- Upper arc leaving gaps for the divider lines -->
  <path d="M 94 286 A 180 180 0 1 1 406 286" class="white-stroke" />
  <!-- Lower arc -->
  <path d="M 112 342 A 180 180 0 0 0 388 342" class="white-stroke" />

  <!-- Horizontal divider lines flanking COMBUSTÍVEL -->
  <line x1="110" y1="358" x2="148" y2="358" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="352" y1="358" x2="390" y2="358" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Fuel Dispenser Icon -->
  <g id="fuel-pump-icon" transform="translate(250, 185)">
    <!-- Base Plate -->
    <rect x="-35" y="15" width="70" height="9" rx="4.5" class="teal-fill" />

    <!-- Main Housing -->
    <path d="M -26 -65 C -26 -72 -20 -77 -13 -77 L 13 -77 C 20 -77 26 -72 26 -65 L 26 15 L -26 15 Z" class="teal-fill" />

    <!-- Meter / Glass window -->
    <rect x="-17" y="-62" width="34" height="26" rx="3" fill="#07213d" />

    <!-- Nozzle Holster -->
    <rect x="26" y="-50" width="5" height="14" rx="2" class="teal-fill" />

    <!-- Hose -->
    <path d="M 29 -42 C 48 -40 56 -20 54 -2 C 52 14 41 14 37 3 L 36 -22"
          fill="none" stroke="#20bca9" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Nozzle -->
    <path d="M 33 -25 L 42 -40 C 43 -44 41 -50 36 -54 L 35 -60 L 41 -64 L 46 -54 C 48 -49 50 -41 47 -36 Z" class="teal-fill" />
  </g>

  <!-- Typography: MAKMO -->
  <text x="250" y="308" class="brand-name">MAKMO</text>

  <!-- Typography: COMBUSTÍVEL -->
  <text x="254" y="366" class="brand-sub">COMBUSTÍVEL</text>
</svg>
